      <rect x="275" y="72" width="14" height="36" rx="7"/>
      <rect x="301" y="72" width="14" height="36" rx="7"/>
      <rect x="327" y="72" width="14" height="36" rx="7"/>
      <rect x="353" y="72" width="14" height="36" rx="7"/>
      <rect x="275" y="132" width="14" height="36" rx="7"/>
      <rect x="301" y="132" width="14" height="36" rx="7"/>
      <rect x="327" y="132" width="14" height="36" rx="7"/>
      <rect x="353" y="132" width="14" height="36" rx="7"/>
