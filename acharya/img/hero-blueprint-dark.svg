<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 656" fill="none">
  <defs>
    <pattern id="bpgrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1080" height="656" fill="#0d0f12"/>
  <rect width="1080" height="656" fill="url(#bpgrid)"/>
  <!-- Outer Drawing Border & Zone Markers -->
  <rect x="24" y="24" width="1032" height="608" rx="6" fill="#13161b" fill-opacity="0.72" stroke="#7b8490" stroke-opacity="0.35" stroke-width="1.2"/>
  <rect x="36" y="36" width="1008" height="584" fill="none" stroke="#7b8490" stroke-opacity="0.22" stroke-width="1"/>

  <!-- Top Sheet Header Bar -->
