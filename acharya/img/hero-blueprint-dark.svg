  <!-- BOTTOM PLAN / SHEET METAL FLAT PATTERN VIEW -->
  <g transform="translate(80, 415)">
    <text x="0" y="-10" font-family="monospace" font-size="11" fill="#18e299">DETAIL C — SHEET METAL &amp; DFAM CHECK</text>
    <rect x="0" y="6" width="520" height="142" rx="6" fill="#0d0f12" stroke="#7b8490" stroke-opacity="0.35" stroke-width="1"/>
    <!-- Bracket Outline with Bend Lines -->
    <path d="M 32 34 L 220 34 L 220 120 L 32 120 Z" fill="#44aeff" fill-opacity="0.06" stroke="#f4f6f8" stroke-width="1.5"/>
    <line x1="68" y1="34" x2="68" y2="120" stroke="#eb9411" stroke-dasharray="5 3" stroke-width="1.2"/>
    <line x1="184" y1="34" x2="184" y2="120" stroke="#eb9411" stroke-dasharray="5 3" stroke-width="1.2"/>
    <rect x="96" y="62" width="60" height="30" rx="15" stroke="#18e299" stroke-width="1.4"/>
    <!-- Inspection Spec Table -->
    <g transform="translate(250, 26)" font-family="monospace" font-size="11" fill="#7b8490">
      <text x="0" y="14" fill="#f4f6f8">SURFACE FINISH</text><text x="165" y="14" fill="#18e299">Ra 0.4 µm</text>
      <line x1="0" y1="24" x2="250" y2="24" stroke="#7b8490" stroke-opacity="0.2"/>
      <text x="0" y="42" fill="#f4f6f8">SHEET K-FACTOR</text><text x="165" y="42" fill="#18e299">0.44 (DIN 6935)</text>
      <line x1="0" y1="52" x2="250" y2="52" stroke="#7b8490" stroke-opacity="0.2"/>
      <text x="0" y="70" fill="#f4f6f8">DFAM OVERHANG</text><text x="165" y="70" fill="#18e299">45° SELF-SUPPORT</text>
      <line x1="0" y1="80" x2="250" y2="80" stroke="#7b8490" stroke-opacity="0.2"/>
      <text x="0" y="98" fill="#f4f6f8">EXCHANGE FORMAT</text><text x="165" y="98" fill="#18e299">STEP AP242 / .x_t</text>
    </g>
  </g>

  <!-- Title Block Bottom Right -->
  <g transform="translate(636, 480)" font-family="monospace">
    <rect x="0" y="0" width="388" height="122" fill="#0d0f12" stroke="#f4f6f8" stroke-opacity="0.45" stroke-width="1.2"/>
    <line x1="0" y1="38" x2="388" y2="38" stroke="#7b8490" stroke-opacity="0.35"/>
    <line x1="0" y1="80" x2="388" y2="80" stroke="#7b8490" stroke-opacity="0.35"/>
    <line x1="210" y1="38" x2="210" y2="122" stroke="#7b8490" stroke-opacity="0.35"/>
    <text x="16" y="24" font-size="13" font-weight="bold" fill="#f4f6f8">ACHARYA N CO — PRECISION CAD STUDIO</text>
    <text x="16" y="56" font-size="10" fill="#7b8490">LOCATION</text>
    <text x="16" y="71" font-size="11" fill="#f4f6f8">HYDERABAD, TELANGANA, IN</text>
    <text x="224" y="56" font-size="10" fill="#7b8490">CRITICAL GRADE</text>
    <text x="224" y="71" font-size="11" fill="#18e299">±0.005 mm / ISO 2768-fH</text>
    <text x="16" y="98" font-size="10" fill="#7b8490">CAD KERNEL</text>
    <text x="16" y="113" font-size="11" fill="#f4f6f8">CREO 12 · SOLIDWORKS 2025</text>
    <text x="224" y="98" font-size="10" fill="#7b8490">DRAWN BY</text>
    <text x="224" y="113" font-size="11" fill="#f4f6f8">K. ACHARYA (CSWP)</text>
  </g>
