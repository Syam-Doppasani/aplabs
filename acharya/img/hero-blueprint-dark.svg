        <line x1="28" y1="0" x2="28" y2="24" stroke="#f4f6f8" stroke-width="1"/>
        <line x1="112" y1="0" x2="112" y2="24" stroke="#f4f6f8" stroke-width="1"/>
        <line x1="140" y1="0" x2="140" y2="24" stroke="#f4f6f8" stroke-width="1"/>
        <line x1="168" y1="0" x2="168" y2="24" stroke="#f4f6f8" stroke-width="1"/>
        <circle cx="14" cy="12" r="5" stroke="#18e299" stroke-width="1.2"/>
        <line x1="7" y1="12" x2="21" y2="12" stroke="#18e299" stroke-width="1"/>
        <line x1="14" y1="5" x2="14" y2="19" stroke="#18e299" stroke-width="1"/>
        <text x="36" y="16" fill="#f4f6f8">±0.005 mm</text>
