    <circle cx="0" cy="0" r="78" stroke="#f4f6f8" stroke-width="1.3" stroke-dasharray="6 4"/>
    <circle cx="0" cy="0" r="54" stroke="#44aeff" stroke-width="1.6"/>
    <circle cx="0" cy="0" r="28" stroke="#eb9411" stroke-width="1.5"/>
    <!-- Radial Flutes / Bolt Circle -->
    <circle cx="66" cy="0" r="5" stroke="#f4f6f8" stroke-width="1.2"/>
    <circle cx="-66" cy="0" r="5" stroke="#f4f6f8" stroke-width="1.2"/>
    <circle cx="0" cy="66" r="5" stroke="#f4f6f8" stroke-width="1.2"/>
    <circle cx="0" cy="-66" r="5" stroke="#f4f6f8" stroke-width="1.2"/>
    <circle cx="46.7" cy="46.7" r="5" stroke="#f4f6f8" stroke-width="1.2"/>
    <circle cx="-46.7" cy="46.7" r="5" stroke="#f4f6f8" stroke-width="1.2"/>
    <circle cx="46.7" cy="-46.7" r="5" stroke="#f4f6f8" stroke-width="1.2"/>
    <circle cx="-46.7" cy="-46.7" r="5" stroke="#f4f6f8" stroke-width="1.2"/>
    <!-- Diameter Leader -->
    <line x1="-38" y1="-38" x2="-108" y2="-88" stroke="#18e299" stroke-width="1.2"/>
    <line x1="-108" y1="-88" x2="-185" y2="-88" stroke="#18e299" stroke-width="1.2"/>
    <text x="-185" y="-94" font-family="monospace" font-size="11" fill="#18e299">Ø50.00 H7 FIT</text>
