    <g stroke="#eb9411" stroke-width="1" fill="#eb9411" font-family="monospace" font-size="11">
      <line x1="20" y1="22" x2="445" y2="22"/>
      <line x1="20" y1="16" x2="20" y2="46" stroke-opacity="0.6"/>
