    <line x1="70" y1="100" x2="240" y2="100" stroke="#7b8490" stroke-dasharray="4 3" stroke-width="1"/>
    <line x1="70" y1="140" x2="240" y2="140" stroke="#7b8490" stroke-dasharray="4 3" stroke-width="1"/>
